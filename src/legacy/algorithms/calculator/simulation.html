    <title>آلة حاسبة علمية</title>

    <script>function toggleMenu(){var m=document.getElementById("navMobile");if(m)m.classList.toggle("open")}</script>

    

    <div class="py-8 md:py-12 px-4">
      <div class="max-w-lg mx-auto">

        <!-- عنوان الصفحة -->
        <div class="text-center mb-8">
          <span class="inline-block text-purple-500 font-bold text-sm tracking-widest uppercase mb-2">SCIENTIFIC CALCULATOR</span>
          <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900">آلة حاسبة علمية متكاملة</h1>
          <p class="text-gray-500 mt-2">حسابات علمية متقدمة مع واجهة سهلة ومباشرة</p>
        </div>

        <!-- الآلة الحاسبة -->
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden p-4">
          <div class="rounded-xl overflow-hidden bg-gray-200 border border-gray-300">
            <!-- شاشة العرض -->
            <div class="bg-slate-800 text-white p-6 pt-8">
              <div id="previous-operand" class="text-left text-lg text-gray-400 h-6 overflow-hidden"></div>
              <div id="current-operand" class="text-left text-5xl font-bold break-all leading-tight h-16 transition-all duration-100">0</div>
            </div>

            <!-- أزرار الآلة الحاسبة - 5 أعمدة -->
            <div class="grid grid-cols-5 gap-1.5 p-3">

              <!-- الصف 1: الدوال المثلثية الأساسية -->
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="sin">sin</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="cos">cos</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="tan">tan</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="log">log</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="ln">ln</button>

              <!-- الصف 2: الدوال الزائدية -->
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="sinh">sinh</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="cosh">cosh</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="tanh">tanh</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="log2">log₂</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="exp10">10ˣ</button>

              <!-- الصف 3: الدوال العكسية والأسية -->
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="asin">sin⁻¹</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="acos">cos⁻¹</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="atan">tan⁻¹</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="exp">eˣ</button>
              <button class="text-xs font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="twopow">2ˣ</button>

              <!-- الصف 4: الجذر والنسبة والمسح -->
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="sqrt">√</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-red-600 hover:bg-red-700 text-white calc-button" data-operation="clear">AC</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white calc-button" data-operation="delete">DEL</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white calc-button" data-function="%">%</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white calc-button" data-operation="÷">÷</button>

              <!-- الصف 5: المكعب والأرقام -->
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="cube">x³</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="7">7</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="8">8</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="9">9</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white calc-button" data-operation="×">×</button>

              <!-- الصف 6: الجذر التكعيبي والأرقام -->
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="cuberoot">∛</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="4">4</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="5">5</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="6">6</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white calc-button" data-operation="-">-</button>

              <!-- الصف 7: المضروب والثابت e والأرقام -->
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="factorial">x!</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="1">1</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="2">2</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="3">3</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white calc-button" data-operation="+">+</button>

              <!-- الصف 8: الثابت e، القيمة المطلقة، الأس الثاني، الأس y، الفاصلة -->
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="euler">e</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="abs">|x|</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="square">x²</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="power">xʸ</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number=".">.</button>

              <!-- الصف 9: مقلوب، π، الإشارة، الصفر، يساوي -->
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="reciprocal">1/x</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="pi">π</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-scientific hover:bg-scientific-hover text-white calc-button" data-function="sign">+/−</button>
              <button class="text-xl font-bold p-3 rounded-xl bg-white hover:bg-gray-200 text-gray-900 calc-button" data-number="0">0</button>
              <button class="text-sm font-semibold p-3 rounded-xl bg-gradient-to-l from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white calc-button shadow-lg shadow-red-200" data-operation="=">=</button>

            </div>
          </div>
        </div>

      </div>
    </div>

    <script src="../../assets/js/calculator.js"></script>
    <script src="../../assets/js/theme-toggle.js"></script>
</body>
</html>
